# All tunable values live here so a reader can swap them without touching code.

judge:
  # Default: a local open-weights model through Ollama (free, no key). The judge is called
  # thousands of times across the experiments, so the faster 3B model is the default; the 7B
  # model is the second judge in the cross-model comparison.
  provider: ollama
  model: qwen2.5:3b-instruct
  max_tokens: 200
  temperature: 0                  # greedy decoding; the bias experiments vary this on purpose
  seed: 7
  ollama_host: http://localhost:11434
  anthropic_model: claude-opus-5-5
  anthropic_effort: medium

data:
  source_url: https://raw.githubusercontent.com/paul-rottger/xstest/main/xstest_prompts.csv
  raw_path: data/raw/xstest_prompts.csv
  prompts_path: data/prompts.csv
  sample_size: 200
  stratify_by: type             # keep every XSTest category represented
  seed: 13
