name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-build-isolation -e ".[dev,legacy]"
      - name: Lint
        run: ruff check .
      - name: Offline unit tests (no LLM calls)
        run: pytest -q -m "not live"
      - name: New package types
        run: mypy src/judge_lab
      - name: Offline gate must reject synthetic evidence
        run: |
          judge-lab demo --out runs/ci-demo
          python - <<'PY'
          import subprocess
          result = subprocess.run([
              "judge-lab", "gate", "--report", "runs/ci-demo/report.json",
              "--policy", "examples/gate_policy.yaml",
          ], check=False)
          assert result.returncode == 4, result.returncode
          PY
